<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touchable Banners</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Index ── */
    #index {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    #content_inicial {
      height: 20vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #content_inicial h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    #content_inicial p {
      margin-top: 0.4rem;
      color: #666;
      font-size: 0.9rem;
    }

    #content_galery {
      height: 80vh;
    }

    #grid {
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 0 10px 10px;
      width: 100%;
      height: 100%;
    }

    .card {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
    }

    .card:active img {
      opacity: 0.85;
    }

    .card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.15s;
    }

    .card span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1.25rem 1rem;
      font-size: 1rem;
      color: #fff;
      text-transform: capitalize;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
    }

    /* ── Banner view ── */
    #banner {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    #banner img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Error ── */
    #error {
      display: none;
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
    }

    #error a { color: #aaa; font-size: 0.85rem; margin-top: 1rem; display: inline-block; }
    #error h2 { font-size: 1.5rem; font-weight: 300; }
    #error p  { margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="index">
    <div id="content_inicial">
      <h1>Olá, bem-vindo!</h1>
      <p>Toque no banner para continuar.</p>
    </div>
    <div id="content_galery">
      <div id="grid"></div>
    </div>
  </div>

  <div id="banner">
    <img id="banner-img" src="" alt="Banner">
  </div>

  <div id="error">
    <h2>Banner não encontrado</h2>
    <p id="error-msg"></p>
    <a href="/">← Voltar ao início</a>
  </div>

  <script>
    var slug = window.location.pathname.replace(/^\/+|\/+$/g, '');

    fetch('/links.json')
      .then(function(r) {
        if (!r.ok) throw new Error('Não foi possível carregar links.json');
        return r.json();
      })
      .then(function(links) {
        if (!slug) {
          showIndex(links);
        } else {
          showBanner(slug, links[slug]);
        }
      })
      .catch(function(err) {
        showError(err.message);
      });

    function showIndex(links) {
      var grid = document.getElementById('grid');
      Object.keys(links).forEach(function(key) {
        var a = document.createElement('a');
        a.className = 'card';
        a.href = '/' + key;

        var img = document.createElement('img');
        img.src = '/images/' + key + '.jpeg';
        img.alt = key;

        var label = document.createElement('span');
        label.textContent = key;

        a.appendChild(img);
        a.appendChild(label);
        grid.appendChild(a);
      });
      document.getElementById('index').style.display = 'flex';
    }

    function showBanner(key, link) {
      var imgEl = document.getElementById('banner-img');
      var bannerEl = document.getElementById('banner');

      imgEl.src = '/images/' + key + '.jpeg';

      imgEl.onerror = function() {
        showError('Imagem não encontrada: /images/' + key + '.jpeg');
      };

      imgEl.onload = function() {
        bannerEl.style.display = 'flex';
      };

      if (link) {
        imgEl.addEventListener('click', function() {
          window.location.href = link;
        });
        imgEl.addEventListener('touchend', function(e) {
          e.preventDefault();
          window.location.href = link;
        });
      }
    }

    function showError(msg) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-msg').textContent = msg;
    }
  </script>

</body>
</html>
