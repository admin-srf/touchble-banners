<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touchable Banners</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #welcome {
      text-align: center;
    }

    #welcome h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    #welcome p {
      margin-top: 1rem;
      color: #888;
      font-size: 1rem;
    }

    #banner {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    #banner img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    #error {
      display: none;
      text-align: center;
      color: #888;
    }

    #error h2 { font-size: 1.5rem; font-weight: 300; }
    #error p { margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="welcome">
    <h1>Welcome</h1>
    <p>Touch a banner to continue.</p>
  </div>

  <div id="banner">
    <img id="banner-img" src="" alt="Banner">
  </div>

  <div id="error">
    <h2>Banner not found</h2>
    <p id="error-msg"></p>
  </div>

  <script>
    const slug = window.location.pathname.replace(/^\/+|\/+$/g, '');

    if (!slug) {
      document.getElementById('welcome').style.display = 'block';
    } else {
      document.getElementById('welcome').style.display = 'none';

      fetch('/links.json')
        .then(function(r) {
          if (!r.ok) throw new Error('Could not load links.json');
          return r.json();
        })
        .then(function(links) {
          var link = links[slug];
          var imgEl = document.getElementById('banner-img');
          var bannerEl = document.getElementById('banner');

          imgEl.src = '/images/' + slug + '.jpeg';

          imgEl.onerror = function() {
            bannerEl.style.display = 'none';
            var errEl = document.getElementById('error');
            errEl.style.display = 'block';
            document.getElementById('error-msg').textContent =
              'Image not found: /images/' + slug + '.jpeg';
          };

          imgEl.onload = function() {
            bannerEl.style.display = 'flex';
          };

          if (link) {
            imgEl.addEventListener('click', function() {
              window.location.href = link;
            });

            imgEl.addEventListener('touchend', function(e) {
              e.preventDefault();
              window.location.href = link;
            });
          }
        })
        .catch(function(err) {
          var errEl = document.getElementById('error');
          errEl.style.display = 'block';
          document.getElementById('error-msg').textContent = err.message;
        });
    }
  </script>

</body>
</html>
